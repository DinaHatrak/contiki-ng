name: RPL Final - Guard v2 and Blackhole

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpl-guard-v2-validation
  cancel-in-progress: false

env:
  RPL_RUNNER_Z: ""

jobs:
  pilot:
    name: Pilot - compile and verify 4 policies
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codespace-reimagined-invention-977xg5wq6vxjh99vv
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Contiki-NG prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make python3
      - name: Restore auditable Python study runner
        run: |
          python3 -c 'import os,zlib,base64,pathlib; pathlib.Path("rpl_guard_v2_runner.py").write_bytes(zlib.decompress(base64.b64decode(os.environ["RPL_RUNNER_Z"])))'
          python3 -m py_compile rpl_guard_v2_runner.py rpl_study.py
          test -f rpl_campaign_v2.csv
          test "$(wc -l < rpl_campaign_v2.csv)" -eq 211
          git show origin/develop:os/net/routing/rpl-lite/rpl-neighbor.c >/tmp/rpl_neighbor_original.c
          sha256sum /tmp/rpl_neighbor_original.c
      - name: Small pilot on all four scenarios and four policies
        run: |
          set -euo pipefail
          for scenario in rank_persistent blackhole rank_pulse_w30 legitimate_change; do
            echo "PILOT scenario=$scenario"
            RPL_SCENARIO="$scenario" python3 rpl_guard_v2_runner.py --pilot
          done
      - name: Preserve pilot data and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpl-v2-pilot
          path: |
            rpl_guard_v2_runner.py
            rpl_final_*_pilot.csv
            rpl_final_*_error.log
            tests/14-rpl-lite/COOJA.testlog
          if-no-files-found: warn

  full:
    name: New study - ${{ matrix.scenario }}
    needs: pilot
    strategy:
      fail-fast: false
      matrix:
        scenario: [rank_persistent, blackhole, rank_pulse_w30, legitimate_change]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codespace-reimagined-invention-977xg5wq6vxjh99vv
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Contiki-NG prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make python3
      - name: Restore identical study runner
        run: |
          python3 -c 'import os,zlib,base64,pathlib; pathlib.Path("rpl_guard_v2_runner.py").write_bytes(zlib.decompress(base64.b64decode(os.environ["RPL_RUNNER_Z"])))'
          python3 -m py_compile rpl_guard_v2_runner.py rpl_study.py
      - name: Execute 40 new paired simulations
        env:
          RPL_SCENARIO: ${{ matrix.scenario }}
        run: |
          python3 rpl_guard_v2_runner.py --seeds 5
      - name: Save completed rows, script, and error logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpl-v2-${{ matrix.scenario }}
          path: |
            rpl_final_*.csv
            rpl_final_*_error.log
            rpl_guard_v2_runner.py
            tests/14-rpl-lite/COOJA.testlog
          if-no-files-found: warn

  summary:
    name: Consolidate and validate every simulation
    if: always()
    needs: [pilot, full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rpl-v2-*
          path: gathered
          merge-multiple: false
      - name: Summarize without inventing conclusions
        run: |
          python3 - <<'PY_SUM'
          import csv, pathlib, statistics, collections
          base=pathlib.Path('gathered')
          paths=sorted(base.glob('rpl-v2-*/rpl_final_*.csv'))
          paths=[p for p in paths if not p.name.endswith('_pilot.csv')]
          rows=[]
          for p in paths:
              with p.open(newline='') as f:
                  rows.extend(csv.DictReader(f))
          out=pathlib.Path('rpl_v2_analysis')
          out.mkdir(exist_ok=True)
          with (out/'all_results.csv').open('w',newline='') as f:
              if rows:
                  w=csv.DictWriter(f,fieldnames=list(rows[0]))
                  w.writeheader()
                  w.writerows(rows)
          modes=('baseline','tuned','guarded','guarded_v2')
          cases=('rank_persistent','blackhole','rank_pulse_w30','legitimate_change')
          groups=collections.defaultdict(list)
          for r in rows:
              groups[(r['scenario'],r['mode'])].append(r)
          summary=[]
          for scenario in cases:
              for mode in modes:
                  subset=groups[(scenario,mode)]
                  def avg(key):
                      vals=[float(r[key]) for r in subset if r.get(key) not in ('',None)]
                      return round(statistics.mean(vals),5) if vals else ''
                  summary.append(dict(scenario=scenario,mode=mode,n=len(subset),
                      pdr=avg('event_pdr'),switches=avg('all_switches_after_event'),
                      client_switches=avg('client_switches_after_event'),
                      first_client_switch_delay_s=avg('first_client_switch_delay_s'),
                      malicious_dio_seen=avg('attack_dio_seen_client'),
                      blackhole_drops=avg('blackhole_drops')))
          with (out/'summary.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(summary[0]))
              w.writeheader(); w.writerows(summary)
          keys=[(r['mode'],r['scenario'],r['nodes'],r['seed']) for r in rows]
          invalid=[]
          if len(keys)!=len(set(keys)): invalid.append('Duplicate combinations')
          if len(rows)!=160: invalid.append('Incomplete results: expected 160, got '+str(len(rows)))
          for r in rows:
              if r['event_pdr'] and not 0<=float(r['event_pdr'])<=1:
                  invalid.append('PDR outside [0,1]')
              if int(r['event_received'])>int(r['event_sent']):
                  invalid.append('Received more than sent')
          bh=[r for r in rows if r['scenario']=='blackhole']
          if bh and not any(int(r['blackhole_drops'])>0 for r in bh):
              invalid.append('Blackhole never forwarded/dropped UDP')
          caveats=[
            'First client switch delay is NOT verified recovery time.',
            'Attacker DIO counts may differ by policy; compare exposure.',
            'Measured ETX is not authentication and cannot by itself detect blackholes.',
            'The conservative MRHOF parameters are a fixed comparator, not independently optimized.',
            'Only five fixed seeds and one geometry per topology; uncertainty is limited.',
            'Do not claim Guard v2 superiority before inspecting paired results and source logs.',
          ]
          report=(f'Executed {len(rows)} of 160 planned new simulations.\n'
            + ('Quality checks PASSED.\n' if not invalid else 'QUALITY FAILURE: '+ '; '.join(sorted(set(invalid)))+'\n')
            + '\n'.join(caveats)+'\n')
          (out/'quality_report.txt').write_text(report)
          print(report)
          for r in summary: print(r)
          if invalid: raise SystemExit('Result integrity checks failed')
          PY_SUM
      - name: Preserve consolidated evidence and quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpl-v2-consolidated-results
          path: rpl_v2_analysis/
          if-no-files-found: warn